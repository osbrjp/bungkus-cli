name: Run Tests
on:
  pull_request:
    types: [review_requested, synchronize, labeled]
  push:
    branches:
      - "main"
permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  run-tests:
    if: |
      (github.event.action == 'review_requested' ||
      (github.event.action == 'labeled' && github.event.label.name == 'ci-testing') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'ci-testing'))) ||
      (github.event_name == 'push')

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/github-script@v9
        name: Set 'ci-testing' label
        if: github.event.action == 'review_requested'
        with:
          script: |
            github.rest.issues.addLabels({
              issue_number: context.payload.pull_request.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ["ci-testing"]
            })
      - uses: actions/setup-go@v7
        with:
          # Use the latest 1.26 patch so the toolchain's standard library carries
          # stdlib security fixes. govulncheck flags stdlib advisories against the
          # exact toolchain version, and go.mod's `go 1.26.0` would pin an
          # unpatched stdlib (crypto/tls, net/textproto, crypto/x509 advisories).
          # check-latest forces a lookup upstream; without it the runner's cached
          # toolchain list can lag a patch behind and re-flag fixed advisories.
          go-version: "1.26.x"
          check-latest: true
      - name: Build and run tests
        run: |
          go build -o /dev/null .
          go test ./...
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # Scaffold a real full-stack project, install it, set up the DB and hit the
  # /health-check endpoint. Catches runtime breakage that `go test` can't (e.g.
  # a bad DATABASE_URL that only fails when the app actually opens the DB).
  scaffold-smoke:
    if: |
      (github.event.action == 'review_requested' ||
      (github.event.action == 'labeled' && github.event.label.name == 'ci-testing') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'ci-testing'))) ||
      (github.event_name == 'push')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # sqlite needs no Docker service, so both ORMs run on the cheap runner.
          - orm: drizzle
            setup_db: pnpm run db:generate && pnpm run db:migrate
          - orm: prisma
            # `prisma migrate dev` is interactive; `db push` syncs the schema
            # non-interactively for the smoke test.
            setup_db: pnpm run db:generate && pnpm exec prisma db push
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          check-latest: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v6
        with:
          # Must track the pnpm major the scaffold targets: the generated
          # pnpm-workspace.yaml uses pnpm-10-only config fields (trustPolicy,
          # minimumReleaseAge, ...) and pnpm 9 errors on a workspace file
          # without a `packages` key.
          version: 10
      - name: Build CLI
        run: go build -o bungkus-cli .
      - name: Scaffold ${{ matrix.orm }} + sqlite
        run: ./bungkus-cli create app --base astro-react --backend hono --orm ${{ matrix.orm }} --db sqlite --layout flat --pm pnpm --git=false
      - name: Install, set up DB, seed
        working-directory: app
        run: |
          cp .env.example .env
          pnpm install
          ${{ matrix.setup_db }}
          pnpm run db:seed
      - name: Boot API and verify /health-check
        working-directory: app
        run: |
          pnpm run dev:server > server.log 2>&1 &
          for i in $(seq 1 30); do
            body=$(curl -s http://localhost:8000/health-check || true)
            if echo "$body" | grep -q '"status":"ok"'; then
              echo "health-check: $body"
              echo "$body" | grep -q '"db":"connected"' || { echo "FAIL: db not connected"; exit 1; }
              echo "$body" | grep -q 'Ada Lovelace' || { echo "FAIL: seed rows missing"; exit 1; }
              exit 0
            fi
            sleep 2
          done
          echo "FAIL: /health-check never came up"; cat server.log; exit 1

  # Scaffold the backend monorepo with every package manager, install it, and
  # prove both apps import @repo/domain: the root build compiles web and api,
  # and the root dev script serves both with the probe in place.
  monorepo-smoke:
    if: |
      (github.event.action == 'review_requested' ||
      (github.event.action == 'labeled' && github.event.label.name == 'ci-testing') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'ci-testing'))) ||
      (github.event_name == 'push')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pm: pnpm
            api: pnpm --filter api run
          - pm: bun
            api: bun run --filter api
          - pm: npm
            api: npm run -w api
          - pm: yarn
            api: yarn workspace api run
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          check-latest: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v6
        if: matrix.pm == 'pnpm'
        with:
          version: 10
      - uses: oven-sh/setup-bun@v2
        if: matrix.pm == 'bun'
        with:
          bun-version: "1.2"
      - name: Install yarn classic
        if: matrix.pm == 'yarn'
        run: npm install -g yarn@1.22.22
      - name: Build CLI
        run: go build -o bungkus-cli .
      - name: Scaffold monorepo (${{ matrix.pm }})
        # No --layout: a backend must default to the monorepo for every PM.
        run: |
          ./bungkus-cli create app --base astro-react --backend hono --orm drizzle --db sqlite --validation zod --pm ${{ matrix.pm }} --git=false
          test -f app/apps/api/package.json
      - name: Import @repo/domain from both apps
        working-directory: app
        run: |
          printf '\nimport { UserSchema } from "@repo/domain";\nconsole.log("domain-probe:", UserSchema.parse({ id: 1, name: "api-ok" }).name);\n' >> apps/api/server/index.ts
          perl -0pi -e 's/^---\n/---\nimport { UserSchema } from "\@repo\/domain";\nconst probe = UserSchema.parse({ id: 1, name: "web-ok" }).name;\n/m; s|</main>|<p>{probe}</p></main>|' apps/web/src/pages/index.astro
      - name: Install and build
        working-directory: app
        run: |
          ${{ matrix.pm }} install
          ${{ matrix.pm }} run build
          grep -q web-ok apps/web/dist/index.html
      - name: Set up DB
        working-directory: app
        run: |
          cp apps/api/.env.example apps/api/.env
          ${{ matrix.api }} db:generate
          ${{ matrix.api }} db:migrate
          ${{ matrix.api }} db:seed
      - name: Root dev serves web and api
        working-directory: app
        run: |
          ${{ matrix.pm }} run dev > dev.log 2>&1 &
          for i in $(seq 1 45); do
            web=$(curl -s http://localhost:3000/ || true)
            api=$(curl -s http://localhost:8000/health-check || true)
            if echo "$web" | grep -q web-ok && echo "$api" | grep -q '"db":"connected"'; then
              grep -q 'domain-probe: api-ok' dev.log || { echo "FAIL: api never logged the domain probe"; cat dev.log; exit 1; }
              echo "health-check: $api"
              exit 0
            fi
            sleep 2
          done
          echo "FAIL: web or api never came up"; cat dev.log; exit 1
